
name: Deploy Web Dashers Offline to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download and verify the exact offline release
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || 'offline-2026-11-21-v2' }}
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/WebDashers_Offline_Updated.zip"
          curl --fail --location --retry 4 --retry-delay 2 \
            --output "${RUNNER_TEMP}/WebDashers_Offline_Updated.zip" \
            "${ASSET_URL}"
          mkdir -p "${RUNNER_TEMP}/extracted" public
          unzip -q "${RUNNER_TEMP}/WebDashers_Offline_Updated.zip" -d "${RUNNER_TEMP}/extracted"
          SOURCE_DIR="${RUNNER_TEMP}/extracted/web-dashers.github.io-main"
          test -f "${SOURCE_DIR}/index.html"
          test -f "${SOURCE_DIR}/service-worker.js"
          test -f "${SOURCE_DIR}/offline-assets.json"
          test -f "${SOURCE_DIR}/offline-check.html"
          grep -Fq '2026-11-21-2' "${SOURCE_DIR}/service-worker.js"
          grep -Fq '"version": "2026-11-21.2"' "${SOURCE_DIR}/offline-assets.json"
          grep -Fq '"cacheName": "webdashers-pages-offline-2026-11-21-2"' "${SOURCE_DIR}/offline-assets.json"
          cp -a "${SOURCE_DIR}/." public/
          touch public/.nojekyll
          test -f public/index.html
          test -f public/offline-check.html
          echo "Verified Web Dashers offline build ${RELEASE_TAG}."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
